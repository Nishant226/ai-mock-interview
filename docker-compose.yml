version: '3.8'

services:
  # 1. FastAPI Service (AI, OpenCV/MediaPipe)
  fastapi:
    build: ./vision-service
    container_name: vision-service_container
    ports:
      - "8000:8000"
    environment:
      - MONGO_URI=mongodb+srv://nishant73026_db_user:Nishant90840@cluster0.izb9n2l.mongodb.net/ai_interview_db?retryWrites=true&w=majority
    networks:
      - app-network

  # 2. Node.js Express Backend Service
  backend:
    build: ./backend
    container_name: node_backend_container
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - MONGO_URI=mongodb+srv://nishant73026_db_user:Nishant90840@cluster0.izb9n2l.mongodb.net/ai_interview_db?retryWrites=true&w=majority
      - ONLINE_COMPILER_API_KEY=cd95c890b0c0a2ac4b0007ecfaf97867
    depends_on:
      - fastapi
    networks:
      - app-network

  # 3. React Frontend Service
  frontend:
    build: ./frontend
    container_name: react_frontend_container
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    depends_on:
      - backend
      - fastapi
    networks:
      - app-network

networks:
  app-network:
    driver: bridge