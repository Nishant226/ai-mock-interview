name: Interview Platform CI/CD Pipeline

on:
  push:
    branches: [ "main" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker Containers
        run: |
          docker compose build

      - name: Verification Success Notice
        run: echo "Docker containers built successfully and passed CI checks! 🚀"